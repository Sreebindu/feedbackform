
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback Form</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      font-family: Arial, sans-serif;
    }

    .feedback-card {
      width: 100%;
      max-width: 620px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .form-header {
      background: #4f46e5;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .form-content {
      padding: 30px;
    }

    .stars {
      display: flex;
      gap: 8px;
      font-size: 35px;
    }

    .star {
      cursor: pointer;
      color: #ccc;
      border: none;
      background: none;
      padding: 0;
    }

    .star.active {
      color: #ffb400;
    }

    .submit-btn {
      background: #4f46e5;
      border: none;
      padding: 12px;
      font-weight: bold;
    }

    .submit-btn:hover {
      background: #3730a3;
    }

    .success-content {
      text-align: center;
      padding: 60px 30px;
    }

    .success-icon {
      font-size: 65px;
      color: #16a34a;
    }

    .success-content h2 {
      color: #16a34a;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="feedback-card">

    <!-- Feedback Form Section -->
    <div id="formSection">

      <div class="form-header">
        <h2>Student Feedback Form</h2>
        <p class="mb-0">
          Cloud Computing & DevOps Training
        </p>
      </div>

      <div class="form-content">

        <form id="feedbackForm">

          <div class="mb-3">
            <label for="studentName" class="form-label">
              Student Name
            </label>
            <input
              type="text"
              class="form-control"
              id="studentName"
              placeholder="Enter your full name"
              required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">
              Email Address
            </label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Enter your email"
              required>
          </div>

          <div class="mb-3">
            <label for="course" class="form-label">
              Course / Module
            </label>

            <select class="form-select" id="course" required>
              <option value="">Select Course</option>
              <option>Cloud Computing</option>
              <option>DevOps</option>
              <option>Linux</option>
              <option>AWS Hands-on Lab</option>
            </select>
          </div>

          <div class="mb-3">

            <label class="form-label">
              Rate Your Learning Experience
            </label>

            <div class="stars">
              <button type="button" class="star"
                      data-rating="1">★</button>
              <button type="button" class="star"
                      data-rating="2">★</button>
              <button type="button" class="star"
                      data-rating="3">★</button>
              <button type="button" class="star"
                      data-rating="4">★</button>
              <button type="button" class="star"
                      data-rating="5">★</button>
            </div>

            <small id="ratingText" class="text-muted">
              Select a rating
            </small>

          </div>

          <div class="mb-4">
            <label for="comments" class="form-label">
              Your Feedback
            </label>

            <textarea
              class="form-control"
              id="comments"
              rows="4"
              placeholder="Share your suggestions..."
              required></textarea>
          </div>

          <button
            type="submit"
            class="btn btn-primary submit-btn w-100">
            Submit Feedback
          </button>

        </form>
      </div>
    </div>

    <!-- Success Message Section -->
    <div id="successSection"
         class="success-content d-none"
         role="status"
         aria-live="polite">

      <div class="success-icon">✓</div>

      <h2>Feedback submitted successfully!</h2>

      <p class="text-muted mt-3">
        Thank you for sharing your valuable feedback.
      </p>

      <p class="text-muted">
        Your feedback helps us improve our training sessions.
      </p>

    </div>

  </div>

  <script>
    let selectedRating = 0;

    const stars = document.querySelectorAll(".star");
    const form = document.getElementById("feedbackForm");

    // Star rating functionality
    stars.forEach(star => {
      star.addEventListener("click", () => {

        selectedRating = Number(star.dataset.rating);

        stars.forEach(item => {
          const value = Number(item.dataset.rating);

          item.classList.toggle(
            "active",
            value <= selectedRating
          );

          item.setAttribute(
            "aria-pressed",
            String(value === selectedRating)
          );
        });

        document.getElementById("ratingText").textContent =
          selectedRating + " out of 5 stars";
      });
    });

    // Form submission
    form.addEventListener("submit", function(event) {

      event.preventDefault();

      // Validate star rating
      if (selectedRating === 0) {
        alert("Please select a star rating.");
        return;
      }

      // Hide entire feedback form
      document.getElementById("formSection")
        .classList.add("d-none");

      // Display only success message
      document.getElementById("successSection")
        .classList.remove("d-none");

    });
  </script>

</body>
</html>
